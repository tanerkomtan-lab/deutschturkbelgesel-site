name: Haber Toplama (RSS Agent)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        working-directory: rss-agent
        run: npm install

      - name: Haberleri çek
        working-directory: rss-agent
        run: node fetch_news.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Sayfaları ve sitemap'i üret
        run: node rss-agent/build_pages.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "dth-bot"
          git config user.email "dth-bot@users.noreply.github.com"
          git add haber sitemap.xml
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Sayfalar ve sitemap güncellendi"
            git pull --rebase
            git push
          fi
