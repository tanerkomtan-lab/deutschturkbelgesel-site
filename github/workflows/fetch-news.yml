name: Haber Toplama (RSS Agent)

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada bir çalışır
  workflow_dispatch: {}       # GitHub arayüzünden manuel de tetiklenebilir

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rss-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node fetch_news.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
