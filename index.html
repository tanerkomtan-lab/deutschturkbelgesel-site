<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschTürkBelgesel - Doğa, Bilim ve Tarih Belgeselleri</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --accent: #4ade80;
    --accent-dark: #22c55e;
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(15,17,21,0.95);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 22px;
    background: linear-gradient(90deg, var(--accent), #60a5fa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
  }
  .filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 16px;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .filter-btn {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: var(--accent);
    color: #0f1115;
    border-color: var(--accent);
    font-weight: 600;
  }
  main {
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .card:active {
    transform: scale(0.98);
  }
  .thumb {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    position: relative;
    overflow: hidden;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-icon::after {
    content: "";
    border-style: solid;
    border-width: 8px 0 8px 14px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }
  .card-body {
    padding: 12px 14px;
  }
  .kanal-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    margin: 0 0 6px 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-desc {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .loading, .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-content {
    width: 100%;
    max-width: 900px;
  }
  .modal-video {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
  }
  .modal-video iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
  .modal-info {
    padding: 16px 4px;
  }
  .modal-info h2 {
    font-size: 18px;
    margin: 0 0 8px 0;
  }
  .modal-info p {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .close-btn {
    position: absolute;
    top: -40px;
    right: 0;
    background: none;
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
  }
  .load-more {
    display: block;
    margin: 24px auto;
    padding: 12px 28px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .load-more:hover { border-color: var(--accent); }
  .load-more:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>🦁 DeutschTürkBelgesel</h1>
  <p>Doğa, bilim ve tarih belgeselleri — BBC Earth, National Geographic, History</p>
  <div class="filters" id="filters"></div>
</header>

<main>
  <div id="content">
    <div class="loading"><div class="spinner"></div>Yükleniyor...</div>
  </div>
  <button class="load-more" id="loadMoreBtn" style="display:none;">Daha fazla göster</button>
</main>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close-btn" id="closeModal">&times;</button>
    <div class="modal-video" id="modalVideo"></div>
    <div class="modal-info">
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://zlvsbcqiwbfnkskkyigr.supabase.co";
const SUPABASE_KEY = "sb_publishable_tKXa7uXaJ_QWWyHbMiJSmg_Wdl7nMzE";

let allVideos = [];
let currentFilter = "hepsi";
let page = 0;
const PAGE_SIZE = 24;

const KANAL_LABELS = {
  bbcearth: "BBC Earth",
  natgeo: "National Geographic",
  history: "History",
};

async function fetchVideos() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/videolar?select=video_id,kanal,kanal_ad,baslik,aciklama&order=id.desc&limit=1000`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
        },
      }
    );
    if (!res.ok) throw new Error("Fetch failed: " + res.status);
    allVideos = await res.json();
    buildFilters();
    render();
  } catch (err) {
    document.getElementById("content").innerHTML =
      `<div class="empty">Videolar yüklenemedi.<br><small>${err.message}</small></div>`;
  }
}

function buildFilters() {
  const kanallar = ["hepsi", ...new Set(allVideos.map(v => v.kanal))];
  const filtersEl = document.getElementById("filters");
  filtersEl.innerHTML = kanallar
    .map(k => {
      const label = k === "hepsi" ? "Hepsi" : (KANAL_LABELS[k] || k);
      return `<button class="filter-btn ${k === currentFilter ? "active" : ""}" data-kanal="${k}">${label}</button>`;
    })
    .join("");

  filtersEl.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.kanal;
      page = 0;
      filtersEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
  });
}

function getFiltered() {
  if (currentFilter === "hepsi") return allVideos;
  return allVideos.filter(v => v.kanal === currentFilter);
}

function render() {
  const filtered = getFiltered();
  const toShow = filtered.slice(0, (page + 1) * PAGE_SIZE);
  const contentEl = document.getElementById("content");
  const loadMoreBtn = document.getElementById("loadMoreBtn");

  if (filtered.length === 0) {
    contentEl.innerHTML = `<div class="empty">Bu kategoride video bulunamadı.</div>`;
    loadMoreBtn.style.display = "none";
    return;
  }

  contentEl.innerHTML = `<div class="grid">${toShow.map(cardHtml).join("")}</div>`;

  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openModal(card.dataset.videoId, card.dataset.baslik, card.dataset.aciklama));
  });

  loadMoreBtn.style.display = toShow.length < filtered.length ? "block" : "none";
}

function cardHtml(v) {
  const label = KANAL_LABELS[v.kanal] || v.kanal_ad || v.kanal;
  const thumb = `https://i.ytimg.com/vi/${v.video_id}/hqdefault.jpg`;
  const safeTitle = escapeHtml(v.baslik || "");
  const safeDesc = escapeHtml(v.aciklama || "");
  return `
    <div class="card" data-video-id="${v.video_id}" data-baslik="${safeTitle}" data-aciklama="${safeDesc}">
      <div class="thumb">
        <img src="${thumb}" alt="${safeTitle}" loading="lazy">
        <div class="play-icon"></div>
      </div>
      <div class="card-body">
        <span class="kanal-badge">${label}</span>
        <p class="card-title">${safeTitle}</p>
        <p class="card-desc">${safeDesc}</p>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function openModal(videoId, baslik, aciklama) {
  document.getElementById("modalVideo").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  document.getElementById("modalTitle").textContent = baslik;
  document.getElementById("modalDesc").textContent = aciklama;
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  document.getElementById("modalVideo").innerHTML = "";
}

document.getElementById("closeModal").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});
document.getElementById("loadMoreBtn").addEventListener("click", () => {
  page++;
  render();
});

fetchVideos();
</script>

</body>
</html>
